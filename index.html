<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
       <img src="https://www.shutterstock.com/shutterstock/photos/1865153395/display_1500/stock-photo-portrait-of-young-smiling-woman-looking-at-camera-with-crossed-arms-happy-girl-standing-in-1865153395.jpg"
               alt="person-image"  class="profile-img" height="250px" width="400px">
      <h1>Rosy John</h1>
       <p class="title">Fronted Developer</p>
       <p class="Bio">Frontend Developer | Building responsive, user-friendly web experiences with HTML, CSS, JavaScript & React</p>
       
       <div class="buttons" >
      <button class="btn" id="followBtn">Follow</button>
      <button class="btn outline"  id="messageBtn">Message</button>
    </div>

</div>
    <script src="script.js"></script>
</body>
</html>
